<title>華語學堂 TOCFL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sidebar hitam pekat + area kerja terang/gelap, aksen biru; jalur belajar linear sebagai tulang punggung. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#0A0C10; --muted:#5A6171; --line:#DCE0E7;
  --accent:#1F5BFF; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF;
  --side:#FFFFFF; --side-ink:#0A0C10; --side-muted:#5A6171; --side-line:#DCE0E7; --side-hover:#ECEEF2;
  --ok:#11804A; --bad:#C62E2E; --lock:#A3A9B6;
  --t1:#D12F2F; --t2:#D97A00; --t3:#1F8A3B; --t4:#1F5BFF; --t5:#7A8291;
  --f-han:"LXGW WenKai TC","Noto Serif TC","DFKai-SB","KaiTi",serif;
  --f-body:"Source Sans 3","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Plus Jakarta Sans","Source Sans 3",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0F; --surface:#14161B; --surface-2:#1C1F26; --ink:#F1F3F7; --muted:#9AA2B3; --line:#272B34;
  --accent:#5E8EFF; --accent-ink:#0B0C0F; --accent-soft:#17213A;
  --side:#050608; --side-ink:#E9ECF2; --side-muted:#7E8697; --side-line:#191C23; --side-hover:#12151B;
  --ok:#4CC27F; --bad:#F06B6B; --lock:#4A505D;
  --t1:#FF6B6B; --t2:#FFAA3B; --t3:#55C878; --t4:#6F9BFF; --t5:#9AA2B3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0F; --surface:#14161B; --surface-2:#1C1F26; --ink:#F1F3F7; --muted:#9AA2B3; --line:#272B34;
  --accent:#5E8EFF; --accent-ink:#0B0C0F; --accent-soft:#17213A;
  --side:#050608; --side-ink:#E9ECF2; --side-muted:#7E8697; --side-line:#191C23; --side-hover:#12151B;
  --ok:#4CC27F; --bad:#F06B6B; --lock:#4A505D;
  --t1:#FF6B6B; --t2:#FFAA3B; --t3:#55C878; --t4:#6F9BFF; --t5:#9AA2B3; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:800}
p{margin:0}
.han{font-family:var(--f-han)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.no-tone .t1,.no-tone .t2,.no-tone .t3,.no-tone .t4,.no-tone .t5{color:inherit}
.hide-pinyin .py,.hide-pinyin .py-block,.hide-pinyin rt,.hide-pinyin .py-hint{display:none!important}
.py-hint{margin-top:6px;font-size:.85rem}
.py-hint summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:999px}
.py-hint summary::-webkit-details-marker{display:none}
.py-hint[open] summary{margin-bottom:4px}
ruby{ruby-position:over}
rt{font-family:var(--f-body);font-size:max(.5em,11px);font-weight:600;color:var(--muted);letter-spacing:0}
.btn-ic{width:18px;height:18px;flex:none}
.tok,.tile{display:inline-grid;justify-items:center;align-content:center;gap:0}
.tok .py,.tile .py{font-family:var(--f-body);font-size:.68rem;line-height:1.2}
.lvl-pick{position:relative;min-width:0}
.lvl-btn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lab chev" "name chev" "sub chev";align-items:center;gap:0 8px;text-align:left;background:var(--side);color:var(--side-ink);border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px}
.lvl-btn:hover{background:var(--side-hover)}
.lvl-btn .lvl-lab{grid-area:lab;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted)}
.lvl-btn b{grid-area:name;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-btn .lvl-sub{grid-area:sub;font-size:.78rem;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-btn .chev{grid-area:chev;width:18px;height:18px;color:var(--accent);transition:transform .2s}
.lvl-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lvl-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--side);border:1px solid var(--side-line);border-radius:10px;padding:6px;display:grid;gap:2px;box-shadow:0 14px 36px rgb(0 0 0 / .22);max-height:min(70vh,460px);overflow-y:auto}
.lvl-menu[hidden]{display:none}
.lvl-opt{display:grid;grid-template-columns:minmax(0,1fr) 20px;align-items:center;gap:8px;text-align:left;border:0;background:none;color:var(--side-ink);border-radius:8px;padding:7px 9px}
.lvl-opt:hover{background:var(--side-hover)}
.lvl-opt[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.lvl-opt b{display:block;font-size:.92rem}
.lvl-opt small{display:block;font-size:.74rem;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-opt .ico svg{width:16px;height:16px}
.lvl-opt.locked b{color:var(--side-muted)}
.lvl-opt.locked .ico{color:var(--side-muted)}
.lvl-note{margin:4px 6px 2px;font-size:.72rem;color:var(--side-muted)}
.mob-bar .lvl-btn{padding:6px 10px;grid-template-areas:"name chev"}
.mob-bar .lvl-btn .lvl-lab,.mob-bar .lvl-btn .lvl-sub{display:none}
.mob-bar .lvl-menu{left:auto;width:min(300px,calc(100vw - 32px))}
.chip.locked{border-style:dashed;color:var(--muted)}
.chip .lk svg{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.unlock-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.unlock-ic svg{width:28px;height:28px}
#unlock-body ul{margin:0;padding-left:18px;display:grid;gap:4px}
.brand span{white-space:nowrap}
.save-btn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--side-ink);padding:4px 0;font-size:.9rem;text-align:left;white-space:nowrap}
.save-btn:hover{color:var(--accent)}
.save-btn svg{width:16px;height:16px;flex:none}
.save-btn span:nth-of-type(1){flex:1}
.save-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:transparent;flex:none;vertical-align:middle;margin-right:2px}
.save-dot.on{background:var(--ok)}
.save-dot.warn{background:var(--t2)}
.save-sec{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.save-sec:last-child{border-bottom:0;padding-bottom:0}
.save-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.save-banner span{flex:1;min-width:220px}
#save-body textarea{font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.flip{width:min(480px,100%);min-height:280px;display:grid;gap:10px;justify-items:center;align-content:center;padding:28px 20px;cursor:pointer;text-align:center}
.flip .front-hz{font-family:var(--f-han);font-size:clamp(3rem,10vw,5rem);line-height:1.1}
.flip .front-tx{font-size:1.5rem;font-weight:700}
.flip .hint{font-size:.8rem;color:var(--muted)}
.no-audio [data-say],.no-audio .audio-only{display:none!important}
.py{color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);vertical-align:middle}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:var(--accent);color:#fff;font-family:var(--f-han);font-size:1.5rem;line-height:1;flex:none}
.brand b{font-family:var(--f-han);font-size:1.3rem;display:block;line-height:1.1;color:var(--side-ink)}
.brand span{font-size:.72rem;color:var(--side-muted);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a .g{font-family:var(--f-han);font-size:1.25rem;width:1.6rem;text-align:center;color:var(--side-muted)}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--accent);color:#fff}
.nav a[aria-current="page"] .g{color:#fff}
.prefs{margin-top:auto;border-top:1px solid var(--side-line);padding-top:10px}
.set-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;font-weight:600;text-align:left}
.set-btn:hover{background:var(--side-hover)}
.set-btn svg{width:20px;height:20px;color:var(--side-muted);flex:none}
.set-btn span:nth-of-type(1){flex:1}
dialog.dlg-sm{max-width:min(420px,calc(100vw - 32px))}
.settings{gap:0}
.set-sec{display:grid;gap:8px;padding:14px 0;border-bottom:1px dashed var(--line)}
.set-sec:first-child{padding-top:0}
.set-sec:last-child{border-bottom:0;padding-bottom:0}
.set-sec > b{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.settings label{display:flex;align-items:center;gap:8px;cursor:pointer}
.settings input[type=range]{width:100%;accent-color:var(--accent)}
.settings input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.theme-sw{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.theme-sw button{border:0;background:none;color:var(--muted);padding:7px 0;font-size:.86rem;font-weight:700}
.theme-sw button[aria-pressed="true"]{background:var(--accent);color:#fff}
main{min-width:0;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:26px}
.head{display:grid;gap:6px}
.eyebrow{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.lede{color:var(--muted);max-width:68ch}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;font-size:.92rem}

/* scrollbar disembunyikan di seluruh halaman; konten tetap bisa digulir */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html,body{overflow-x:hidden}
.side{overflow-x:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.burger{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--side-line);background:var(--side);color:var(--side-ink);flex:none}
.burger:hover{border-color:var(--accent);color:var(--accent)}
.burger svg{width:20px;height:20px}
.side-open{position:fixed;z-index:20;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:none;box-shadow:0 4px 14px rgb(0 0 0 / .12)}
.app.collapsed{grid-template-columns:minmax(0,1fr)}
.app.collapsed .side{display:none}
.app.collapsed .side-open{display:inline-grid}
.app.collapsed main{padding-top:72px}
.scrim{display:none}
.mob-top{display:none}
@media (max-width:860px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side,.app.collapsed .side{display:flex;position:fixed;inset:0 auto 0 0;height:100%;width:min(300px,86vw);z-index:40;transform:translateX(-105%);transition:transform .25s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgb(0 0 0 / .25)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgb(5 6 8 / .5)}
  .app.collapsed .side-open{display:none}
  .app.collapsed main{padding-top:20px}
  .mob-top{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--side);color:var(--side-ink);border-bottom:1px solid var(--side-line)}
  .mob-bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .mob-bar .mark{width:34px;height:34px;font-size:1.2rem}
  .mob-title{font-family:var(--f-han);font-size:1.15rem;font-weight:700;white-space:nowrap}
  main{padding-block:20px 60px}
  h2{font-size:1.38rem}
}
@media (max-width:420px){ .mob-title{display:none} .hero-copy h1{font-size:1.75rem} .panel{padding:16px} }
@media (prefers-reduced-motion:reduce){ .side{transition:none} }

/* pieces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:none;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--surface-2);vertical-align:top}
th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.tian{position:relative;border:1.5px solid var(--ink);background:
  repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px) center/100% 1px no-repeat,
  repeating-linear-gradient(0deg,var(--line) 0 6px,transparent 6px 12px) center/1px 100% no-repeat,
  var(--surface)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-copy{display:grid;gap:14px;align-content:center}
.hero-copy h1{font-size:clamp(1.9rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.02em}
.hero-copy h1 .han{color:var(--accent);font-weight:700}
.next{display:grid;gap:12px;align-content:start;border:1.5px solid var(--accent)}
.next .ttl{font-family:var(--f-disp);font-weight:800;font-size:1.25rem}
.next .btn{justify-self:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-disp);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:.85rem;color:var(--muted)}
.lv-rows{display:grid;gap:10px}
.lv-row{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:14px;align-items:center}
.lv-row b{font-size:.95rem}
.lv-row span{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lv-row{grid-template-columns:110px minmax(0,1fr) 70px}}

/* course map */
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.level>summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.level>summary::-webkit-details-marker{display:none}
.level>summary .lv-name{font-family:var(--f-disp);font-weight:800;font-size:1.08rem}
.level>summary .progress{grid-column:1/-1}
.level .units{border-top:1px solid var(--line);padding:6px 10px 12px}
.unit{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 8px;border-radius:8px;width:100%;text-align:left;background:none;border:0;color:var(--ink)}
.unit:hover:not(:disabled){background:var(--surface-2)}
.unit:disabled{cursor:not-allowed;color:var(--lock)}
.unit .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.unit.done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.unit.current .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.unit .u-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .u-s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit:disabled .u-s{color:var(--lock)}
.unit .st{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.unit.current .st{color:var(--accent)}
.skip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 8px 4px;border-top:1px dashed var(--line);margin-top:6px}

/* word cards */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.toolbar .field{max-width:320px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:3px;align-content:start;position:relative}
.word .hz{font-family:var(--f-han);font-size:2.6rem;line-height:1.15;word-break:break-all;padding-right:40px}
.word .py{font-size:1.1rem}
.word .arti{font-weight:600;font-size:1.05rem}
.word .alt{font-size:.92rem;color:var(--muted)}
.word .note{font-size:.92rem;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px;margin-top:4px}
.word .acts .small{font-size:.85rem}
.word .tag{font-size:.75rem}
.word .acts{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.word .lvl{position:absolute;top:12px;right:12px;display:flex;gap:3px}
.word .lvl i{width:6px;height:6px;border-radius:50%;background:var(--surface-2)}
.word .lvl i.on{background:var(--accent)}

/* hanzi */
.writer-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.writer-target{width:240px;height:240px}
.writer-side{display:grid;gap:12px}
.rad-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}

.pair{display:flex;flex-wrap:wrap;gap:8px}
.pair span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--f-han);font-size:1.4rem}

/* grammar, dialog */
.gram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

.sent>[data-say]{grid-row:span 3}

.sent .s-py,.sent .s-id{grid-column:2}

.no-audio .sent{grid-template-columns:minmax(0,1fr)}
.no-audio .sent .s-han,.no-audio .sent .s-py,.no-audio .sent .s-id{grid-column:1}
.line{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:12px 6px;border-top:1px dashed var(--line);align-items:start}

/* tests */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.quiz{display:grid;gap:16px;max-width:680px;margin:0 auto;width:100%}

.q-prompt{display:grid;gap:8px;justify-items:center;text-align:center;padding:20px}

.dlg-mini{display:grid;gap:6px;text-align:left;width:100%}

.tok:hover:not(:disabled){border-color:var(--accent)}
.tok.used{visibility:hidden}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:24px}
.result .big{font-family:var(--f-han);font-size:3rem;color:var(--accent)}

.fc{display:grid;gap:16px;justify-items:center;text-align:center}

.fc-back{display:grid;gap:4px;justify-items:center}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:min(680px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 40px);overflow:auto}

.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px;display:grid;gap:14px}

 {t:"Catatan harian",h:"今天是我來臺灣的第一天。早上我坐飛機到桃園機場，然後坐捷運到臺北。臺北的人很熱情，我問路的時候，一位阿姨帶我走到旅館。",p:"Jīntiān shì wǒ lái Táiwān de dì yī tiān. Zǎoshàng wǒ zuò fēijī dào Táoyuán jīchǎng, ránhòu zuò jiéyùn dào Táiběi. Táiběi de rén hěn rèqíng, wǒ wènlù de shíhòu, yí wèi āyí dài wǒ zǒu dào lǚguǎn.",id:"Hari ini hari pertamaku di Taiwan. Pagi aku naik pesawat ke Bandara Taoyuan, lalu naik MRT ke Taipei. Orang Taipei ramah; waktu aku tanya jalan, seorang ibu mengantarku sampai ke hotel.",qs:[

GRAMMAR.push(
 {lv:4,j:"Bahkan … pun: 連…都/也",pola:"連 X 都/也 …",d:"Menekankan hal yang ekstrem: bahkan X pun.",c:[["他忙得連飯都沒時間吃。","Tā máng de lián fàn dōu méi shíjiān chī.","Dia begitu sibuk sampai makan pun tidak sempat."],["這個字連老師也不認識。","Zhège zì lián lǎoshī yě bú rènshì.","Karakter ini bahkan guru pun tidak tahu."]]},
 {lv:4,j:"Selain: 除了…以外",pola:"除了 X 以外，還/也/都 …",d:"Dengan 還/也 berarti \"selain X, juga…\"; dengan 都 berarti \"kecuali X, semuanya…\".",c:[["除了中文以外，我還會說日文。","Chúle Zhōngwén yǐwài, wǒ hái huì shuō Rìwén.","Selain bahasa Mandarin, saya juga bisa bahasa Jepang."],["除了星期天以外，他每天都上班。","Chúle Xīngqítiān yǐwài, tā měitiān dōu shàngbān.","Kecuali hari Minggu, dia bekerja setiap hari."]]},
 {lv:4,j:"Makin … makin: 越來越 / 越…越…",pola:"越 A 越 B",d:"越來越 + sifat = makin lama makin; 越 A 越 B = makin A makin B.",c:[["天氣越來越熱了。","Tiānqì yuè lái yuè rè le.","Cuaca makin lama makin panas."],["這本書我越看越喜歡。","Zhè běn shū wǒ yuè kàn yuè xǐhuān.","Buku ini makin saya baca makin saya suka."]]},
 {lv:4,j:"Begitu … langsung: 一…就…",pola:"一 A 就 B",d:"Begitu A terjadi, B langsung terjadi.",c:[["他一下課就去打工。","Tā yí xiàkè jiù qù dǎgōng.","Begitu kelas selesai, dia langsung pergi kerja paruh waktu."],["這個問題我一聽就懂了。","Zhège wèntí wǒ yì tīng jiù dǒng le.","Soal ini begitu saya dengar langsung paham."]]},
 {lv:5,j:"Tidak hanya … tetapi juga: 不但…而且…",pola:"不但 A，而且 B",d:"Menambahkan informasi yang lebih kuat.",c:[["這家餐廳不但便宜，而且很好吃。","Zhè jiā cāntīng búdàn piányí, érqiě hěn hǎochī.","Restoran ini tidak hanya murah, tetapi juga enak."],["她不但會說中文，而且還會寫書法。","Tā búdàn huì shuō Zhōngwén, érqiě hái huì xiě shūfǎ.","Dia tidak hanya bisa berbahasa Mandarin, tetapi juga menulis kaligrafi."]]},
 {lv:5,j:"Karena sudah … maka: 既然…就…",pola:"既然 A，就 B",d:"Berdasarkan fakta A yang sudah jelas, maka B.",c:[["既然你不舒服，就早點回家休息吧。","Jìrán nǐ bù shūfú, jiù zǎo diǎn huíjiā xiūxí ba.","Karena kamu tidak enak badan, pulanglah lebih awal dan istirahat."],["既然決定了，就不要後悔。","Jìrán juédìng le, jiù búyào hòuhuǐ.","Karena sudah diputuskan, jangan menyesal."]]},
 {lv:5,j:"Apa pun … tetap: 無論/不管…都…",pola:"無論 + kata tanya … 都 …",d:"Hasilnya sama dalam kondisi apa pun.",c:[["無論多忙，他每天都運動。","Wúlùn duō máng, tā měitiān dōu yùndòng.","Sesibuk apa pun, dia berolahraga setiap hari."],["不管你去哪裡，我都跟你去。","Bùguǎn nǐ qù nǎlǐ, wǒ dōu gēn nǐ qù.","Ke mana pun kamu pergi, aku ikut."]]},
 {lv:6,j:"Daripada … lebih baik: 與其…不如…",pola:"與其 A，不如 B",d:"Membandingkan dua pilihan dan memilih B.",c:[["與其在家生氣，不如出去走走。","Yǔqí zài jiā shēngqì, bùrú chūqù zǒuzǒu.","Daripada marah di rumah, lebih baik keluar jalan-jalan."],["與其抱怨，不如想辦法解決問題。","Yǔqí bàoyuàn, bùrú xiǎng bànfǎ jiějué wèntí.","Daripada mengeluh, lebih baik cari cara menyelesaikan masalah."]]},
 {lv:6,j:"Sekalipun … tetap: 即使…也…",pola:"即使 A，也 B",d:"Pengandaian kuat: walaupun A benar-benar terjadi, B tetap.",c:[["即使明天下大雨，比賽也會照常舉行。","Jíshǐ míngtiān xià dàyǔ, bǐsài yě huì zhàocháng jǔxíng.","Sekalipun besok hujan deras, pertandingan tetap diadakan seperti biasa."],["即使失敗了，這次的經驗也很寶貴。","Jíshǐ shībài le, zhè cì de jīngyàn yě hěn bǎoguì.","Sekalipun gagal, pengalaman kali ini tetap berharga."]]},
 {lv:6,j:"Apalagi: …何況…",pola:"A 都…，何況 B",d:"Jika A saja begitu, apalagi B.",c:[["這個問題連老師都不會，何況是學生。","Zhège wèntí lián lǎoshī dōu bú huì, hékuàng shì xuéshēng.","Soal ini guru pun tidak bisa, apalagi murid."],["平常都塞車了，何況是連假。","Píngcháng dōu sāichē le, hékuàng shì liánjià.","Hari biasa saja macet, apalagi libur panjang."]]}
);

 {lv:5,j:"Membagi tugas kelompok",s:"Dua mahasiswa merencanakan laporan kelompok.",b:[

 {lv:5,j:"Wawancara kerja",s:"Wawancara untuk posisi penuh waktu di perusahaan dagang.",b:[

  ["Pewawancara","很好。我們下個星期會通知你結果。","Hěn hǎo. Wǒmen xià ge xīngqí huì tōngzhī nǐ jiéguǒ.","Baik. Kami akan memberi tahu hasilnya minggu depan."]]},
 {lv:6,j:"Diskusi: penuaan penduduk",s:"Diskusi panel tentang angka kelahiran di Taiwan.",b:[

  ["Pemasok","如果訂單數量增加到五千件，我們可以給您打九折。","Rúguǒ dìngdān shùliàng zēngjiā dào wǔqiān jiàn, wǒmen kěyǐ gěi nín dǎ jiǔ zhé.","Jika jumlah pesanan naik menjadi lima ribu unit, kami bisa beri diskon 10%."],

  ["Pemasok","這恐怕有點困難，工廠的產能已經排滿了。","Zhè kǒngpà yǒudiǎn kùnnán, gōngchǎng de chǎnnéng yǐjīng pái mǎn le.","Itu sepertinya agak sulit, kapasitas pabrik sudah penuh."],
  ["Pembeli","既然如此，我們分兩批交貨，您看可行嗎？","Jìrán rúcǐ, wǒmen fēn liǎng pī jiāohuò, nín kàn kěxíng ma?","Kalau begitu, kita kirim dalam dua tahap; menurut Anda bisa?"],

 {lv:6,t:"Opini: kerja jarak jauh",h:"疫情過後，遠距工作已成為許多企業的常態。支持者認為，員工省下通勤時間，工作效率反而提升；反對者則指出，缺乏面對面交流，團隊的向心力與創意容易受到影響。由此可見，如何在彈性與合作之間取得平衡，將是管理者未來的重要課題。",p:"Yìqíng guòhòu, yuǎnjù gōngzuò yǐ chéngwéi xǔduō qìyè de chángtài. Zhīchízhě rènwéi, yuángōng shěng xià tōngqín shíjiān, gōngzuò xiàolǜ fǎn'ér tíshēng; fǎnduìzhě zé zhǐchū, quēfá miànduìmiàn jiāoliú, tuánduì de xiàngxīnlì yǔ chuàngyì róngyì shòudào yǐngxiǎng. Yóu cǐ kějiàn, rúhé zài tánxìng yǔ hézuò zhījiān qǔdé pínghéng, jiāng shì guǎnlǐzhě wèilái de zhòngyào kètí.",id:"Setelah pandemi, kerja jarak jauh menjadi kebiasaan di banyak perusahaan. Pendukungnya berpendapat karyawan menghemat waktu perjalanan sehingga produktivitas justru meningkat; penentangnya menunjukkan bahwa tanpa interaksi tatap muka, kekompakan dan kreativitas tim mudah terganggu. Karena itu, cara menyeimbangkan fleksibilitas dan kerja sama akan menjadi persoalan penting bagi para manajer.",qs:[
  ["反對者擔心什麼？","Fǎnduìzhě dānxīn shénme?","Apa yang dikhawatirkan pihak penentang?",["團隊合作與創意受影響","tuánduì hézuò yǔ chuàngyì shòu yǐngxiǎng"],["通勤時間太長","tōngqín shíjiān tài cháng"],["薪水降低","xīnshuǐ jiàngdī"]],

 {lv:6,t:"Bahasa dan identitas",h:"語言不僅是溝通的工具，更承載著一個社會的記憶與價值觀。以臺灣為例，華語、臺語、客語與原住民族語言並存，反映出多元的歷史背景。近年來，政府積極推動本土語言教育，希望年輕一代在全球化的浪潮中，仍能保有自己的文化根源。",p:"Yǔyán bùjǐn shì gōutōng de gōngjù, gèng chéngzài zhe yí ge shèhuì de jìyì yǔ jiàzhíguān. Yǐ Táiwān wéi lì, Huáyǔ, Táiyǔ, Kèyǔ yǔ yuánzhùmínzú yǔyán bìngcún, fǎnyìng chū duōyuán de lìshǐ bèijǐng. Jìnniánlái, zhèngfǔ jījí tuīdòng běntǔ yǔyán jiàoyù, xīwàng niánqīng yí dài zài quánqiúhuà de làngcháo zhōng, réng néng bǎoyǒu zìjǐ de wénhuà gēnyuán.",id:"Bahasa bukan hanya alat komunikasi, tetapi juga membawa ingatan dan nilai-nilai suatu masyarakat. Contohnya Taiwan: bahasa Mandarin, Taiwan (Hokkien), Hakka, dan bahasa-bahasa masyarakat adat hidup berdampingan, mencerminkan latar sejarah yang beragam. Beberapa tahun terakhir pemerintah giat mendorong pendidikan bahasa lokal, agar generasi muda tetap menjaga akar budayanya di tengah arus globalisasi.",qs:[
  ["政府推動本土語言教育的目的是什麼？","Zhèngfǔ tuīdòng běntǔ yǔyán jiàoyù de mùdì shì shénme?","Apa tujuan pemerintah mendorong pendidikan bahasa lokal?",["讓年輕人保有文化根源","ràng niánqīngrén bǎoyǒu wénhuà gēnyuán"],["取代華語","qǔdài Huáyǔ"],["吸引觀光客","xīyǐn guānguāngkè"]],

 {lv:4,t:"Festival Lampion",h:"每年農曆一月十五日是元宵節。這一天，很多地方會舉辦燈會，大家一邊吃湯圓，一邊看花燈。在新北市平溪，人們還會放天燈，把自己的願望寫在天燈上，希望願望能實現。",p:"Měi nián nónglì yī yuè shíwǔ rì shì Yuánxiāojié. Zhè yì tiān, hěn duō dìfāng huì jǔbàn dēnghuì, dàjiā yìbiān chī tāngyuán, yìbiān kàn huādēng. Zài Xīnběi shì Píngxī, rénmen hái huì fàng tiāndēng, bǎ zìjǐ de yuànwàng xiě zài tiāndēng shàng, xīwàng yuànwàng néng shíxiàn.",id:"Setiap tanggal 15 bulan pertama kalender Imlek adalah Festival Lampion. Banyak tempat mengadakan pameran lampion; orang makan tangyuan sambil menonton lampion hias. Di Pingxi, New Taipei, orang juga menerbangkan lampion langit dan menuliskan harapan di atasnya agar terkabul.",qs:[

 {lv:5,t:"Gula dalam minuman",h:"根據衛生福利部的建議，成年人每天攝取的糖不應該超過五十公克。然而，一杯全糖的珍珠奶茶就可能含有六十公克以上的糖。專家提醒，喜歡喝手搖飲的人最好選擇微糖或無糖，以免增加罹患糖尿病的風險。",p:"Gēnjù Wèishēng Fúlìbù de jiànyì, chéngniánrén měitiān shèqǔ de táng bù yīnggāi chāoguò wǔshí gōngkè. Rán'ér, yì bēi quántáng de zhēnzhū nǎichá jiù kěnéng hányǒu liùshí gōngkè yǐshàng de táng. Zhuānjiā tíxǐng, xǐhuān hē shǒuyáoyǐn de rén zuìhǎo xuǎnzé wéitáng huò wútáng, yǐmiǎn zēngjiā líhuàn tángniàobìng de fēngxiǎn.",id:"Menurut anjuran Kementerian Kesehatan dan Kesejahteraan, orang dewasa sebaiknya tidak mengonsumsi lebih dari 50 gram gula per hari. Padahal, segelas bubble tea gula penuh bisa mengandung lebih dari 60 gram gula. Para ahli mengingatkan, penggemar minuman kocok sebaiknya memilih sedikit gula atau tanpa gula agar tidak meningkatkan risiko diabetes.",qs:[

  ["專家為什麼建議選擇微糖或無糖？","Zhuānjiā wèishénme jiànyì xuǎnzé wéitáng huò wútáng?","Mengapa ahli menyarankan sedikit atau tanpa gula?",["降低得糖尿病的風險","jiàngdī dé tángniàobìng de fēngxiǎn"],["比較便宜","bǐjiào piányí"],["比較好喝","bǐjiào hǎohē"]]]},

 {lv:5,t:"Gaya hidup minimalis",h:"近年來，「斷捨離」的生活方式在年輕人之間越來越流行。他們認為，與其買很多用不到的東西，不如只留下真正需要的物品。這樣不但能節省開支，還能讓生活空間更整齊，心情也跟著放鬆。",p:"Jìnniánlái, duànshělí de shēnghuó fāngshì zài niánqīngrén zhījiān yuè lái yuè liúxíng. Tāmen rènwéi, yǔqí mǎi hěn duō yòng bú dào de dōngxi, bùrú zhǐ liú xià zhēnzhèng xūyào de wùpǐn. Zhèyàng búdàn néng jiéshěng kāizhī, hái néng ràng shēnghuó kōngjiān gèng zhěngqí, xīnqíng yě gēn zhe fàngsōng.",id:"Beberapa tahun terakhir, gaya hidup \"danshari\" (merapikan dan melepas barang) makin populer di kalangan anak muda. Mereka berpendapat, daripada membeli banyak barang yang tak terpakai, lebih baik hanya menyimpan yang benar-benar dibutuhkan. Dengan begitu bukan hanya menghemat pengeluaran, ruang hidup juga lebih rapi dan hati ikut lega.",qs:[
  ["「斷捨離」的主要想法是什麼？","Duànshělí de zhǔyào xiǎngfǎ shì shénme?","Apa gagasan utama \"danshari\"?",["只留下真正需要的東西","zhǐ liú xià zhēnzhèng xūyào de dōngxi"],["多買便宜的東西","duō mǎi piányí de dōngxi"],["常常換新家具","chángcháng huàn xīn jiājù"]],

READ.push(
 {lv:6,t:"Kesepian di kota",h:"一項最新的調查顯示，超過四成的都市年輕人經常感到孤單。研究人員指出，社群媒體雖然讓人與人之間的聯繫更加便利，卻也使許多人以「按讚」取代了真正的交流，以致人際關係變得表面化。專家建議，不妨每週安排固定的時間，與親友面對面相處。",p:"Yí xiàng zuìxīn de diàochá xiǎnshì, chāoguò sì chéng de dūshì niánqīngrén jīngcháng gǎndào gūdān. Yánjiū rényuán zhǐchū, shèqún méitǐ suīrán ràng rén yǔ rén zhījiān de liánxì gèngjiā biànlì, què yě shǐ xǔduō rén yǐ àn zàn qǔdài le zhēnzhèng de jiāoliú, yǐzhì rénjì guānxì biàn de biǎomiànhuà. Zhuānjiā jiànyì, bùfáng měi zhōu ānpái gùdìng de shíjiān, yǔ qīnyǒu miànduìmiàn xiāngchǔ.",id:"Survei terbaru menunjukkan lebih dari 40% anak muda perkotaan sering merasa kesepian. Para peneliti menyebut media sosial memang mempermudah hubungan antarmanusia, tetapi juga membuat banyak orang mengganti interaksi sejati dengan sekadar \"menyukai\", sehingga hubungan sosial menjadi dangkal. Para ahli menyarankan menyisihkan waktu tetap setiap minggu untuk bertemu langsung dengan keluarga dan teman.",qs:[

const MARKS = {a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
const UNMARK = {};
for (const [v, s] of Object.entries(MARKS)) [...s].forEach((c,i)=>{ UNMARK[c]=[v,i+1]; UNMARK[c.toUpperCase()]=[v.toUpperCase(),i+1]; });
function parseSyl(s){ let tone=5, base=""; for (const ch of s){ if (UNMARK[ch]){ base+=UNMARK[ch][0]; tone=UNMARK[ch][1]; } else base+=ch; } return {base, tone}; }
function markSyl(base, tone){
  if (tone<1 || tone>4) return base;
  const low = base.toLowerCase();
  let idx = low.indexOf("a");
  if (idx<0) idx = low.indexOf("e");
  if (idx<0 && low.includes("ou")) idx = low.indexOf("o");
  if (idx<0) for (let i=low.length-1;i>=0;i--) if ("aeiouü".includes(low[i])) { idx=i; break; }
  if (idx<0) return base;
  const v = low[idx], m = MARKS[v][tone-1];
  return base.slice(0,idx) + (base[idx]===v ? m : m.toUpperCase()) + base.slice(idx+1);
}
const numToMark = s => s.replace(/([a-zA-ZüÜ:]+)([1-5])/g, (_, syl, t) => markSyl(syl.replace(/u:|v/g,"ü").replace(/U:|V/g,"Ü"), +t));
const FINALS = "iang iong uang ueng ang eng ing ong ian iao uai uan üan ai ei ao ou an en er in un ün ia ie iu ua uo ui üe ue io a o e i u ü ê".split(" ");
const INITS = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w",""];
/* memecah pinyin (boleh tanpa spasi) menjadi tepat n suku kata; null bila gagal */
const splitCache = new Map();
function splitPinyin(p, n){
  const key = p+"#"+n; if (splitCache.has(key)) return splitCache.get(key);
  const chars = [], bounds = new Set();
  for (const ch of p.normalize("NFC")){
    const low = UNMARK[ch] ? UNMARK[ch][0].toLowerCase() : ch.toLowerCase();
    if (/[a-zü]/.test(low)) chars.push([ch, low]); else bounds.add(chars.length);
  }
  const base = chars.map(c=>c[1]).join(""), L = base.length, memo = new Map();
  const ends = i => {
    const out = new Set();
    for (const ini of INITS){ if (!base.startsWith(ini,i)) continue; const j = i+ini.length; for (const f of FINALS) if (base.startsWith(f,j)) out.add(j+f.length); }
    if (base[i]==="r") out.add(i+1);
    return [...out].filter(j => { for (let k=i+1;k<j;k++) if (bounds.has(k)) return false; return true; }).sort((a,b)=>b-a);
  };
  const go = (i, k) => {
    if (i===L) return k===0 ? [] : null;
    if (k===0) return null;
    const mk = i*64+k; if (memo.has(mk)) return memo.get(mk);
    let res = null;
    for (const j of ends(i)){ const r = go(j, k-1); if (r){ res = [j, ...r]; break; } }
    memo.set(mk, res); return res;
  };
  const cuts = n>0 ? go(0, n) : null;
  let out = null;
  if (cuts){ let s = 0; out = cuts.map(e => { const syl = chars.slice(s,e).map(c=>c[0]).join(""); s = e; return syl; }); }
  splitCache.set(key, out); return out;
}
const hanCount = h => [...h].filter(isHan).length;
/* hanzi berwarna nada */
function hanziHTML(h, p){
  const syl = splitPinyin(p, hanCount(h));
  if (!syl) return esc(h);
  let k = 0;
  return [...h].map(c => isHan(c) ? `<span class="t${parseSyl(syl[k++]).tone}">${c}</span>` : esc(c)).join("");
}
/* hanzi dengan pinyin di atas tiap karakter (disembunyikan bila pinyin dimatikan) */
function rubyHTML(h, p){
  const syl = splitPinyin(p, hanCount(h));
  if (!syl) return esc(h);
  let k = 0;
  return [...h].map(c => isHan(c) ? `<ruby class="t${parseSyl(syl[k]).tone}">${c}<rt>${esc(syl[k++])}</rt></ruby>` : esc(c)).join("");
}
/* pinyin per token untuk soal susun kalimat */
function tokPinyin(toks, p){
  const syl = splitPinyin(p, hanCount(toks.join("")));
  if (!syl) return toks.map(()=>"");
  let k = 0;
  return toks.map(t => { const n = hanCount(t), s = syl.slice(k, k+n).join(""); k += n; return s; });
}
const tokHTML = (t, py) => `${esc(t)}${py?`<span class="py">${esc(py)}</span>`:""}`;
function sandhi(syl){
  if (!syl) return "";
  const t = syl.map(parseSyl), out = syl.slice(); let changed = false;
  for (let i=0;i<t.length-1;i++) if (t[i].tone===3 && t[i+1].tone===3){ out[i] = markSyl(t[i].base, 2); changed = true; }
  return changed ? out.join("") : "";
}

const IDC = {"⿰":"kiri–kanan","⿱":"atas–bawah","⿲":"kiri–tengah–kanan","⿳":"atas–tengah–bawah","⿴":"mengelilingi penuh","⿵":"mengelilingi, terbuka di bawah",

const TYPE_ID = {pictophonetic:["形聲","Gambar-bunyi: satu komponen memberi petunjuk makna, satu lagi petunjuk bunyi."],

function parseIDS(s){
  const cs = [...s]; let i = 0;
  const node = () => { const c = cs[i++]; if (c===undefined) return null; if (!IDC[c]) return {ch:c}; const kids = []; for (let k=0;k<("⿲⿳".includes(c)?3:2);k++) kids.push(node()); return {op:c, kids}; };
  return node();
}
const treeOf = ch => { const d = DECOMP[ch]; return d && d.ids && d.ids!=="？" && d.ids!==ch ? parseIDS(d.ids) : null; };
function partHTML(n, info){

  const d = DECOMP[n.ch], role = n.ch===info.sem ? '<span class="role sem">makna</span>' : n.ch===info.pho ? '<span class="role pho">bunyi</span>' : "";
  return `<div class="dc-part"><button data-hz="${n.ch}" title="Bedah ${n.ch}">${n.ch}</button>${role}<span>${d?`<span class="py">${esc(d.py)}</span> <span class="small muted">${esc(d.def)}</span>`:""}</span></div>`;
}

function unlockQuestions(target){
  const from = Math.min(prefs.unlocked, target-1), lv = []; for (let l=from; l<target; l++) lv.push(l);
  const per = Math.ceil(16/lv.length), qs = [];
  for (const L of lv){

    for (let k=0; k<per; k++) qs.push(kinds[k % kinds.length]());

/* ================= JALUR BELAJAR (linear) ================= */
/* unit keterampilan per level: tata bahasa, dialog, tanya-jawab, bacaan, dan pemahaman dialog dari level itu sendiri */
const chunk = (a, n) => Array.from({length:Math.ceil(a.length/n)}, (_,i)=>a.slice(i*n, i*n+n));

/* ---------- LINEAR: materi hanya muncul setelah semua karakternya diajarkan ----------
   VUNITS = urutan unit kosakata. CHAR_V = karakter → nomor unit kosakata yang pertama mengajarkannya.
   Setiap materi mendapat vp (posisi paling awal: unit kosakata terakhir yang ia butuhkan) dan
   elv (level efektif = max(level tulisannya, level karakter tersulitnya)). Materi dengan karakter di
   luar kosakata TOCFL mendapat vp = Infinity dan tidak pernah dipakai. */
const VUNITS = [];
LEVELS.forEach((L, li) => { const ws = BYLVL[li];
  for (let i=0, n=1; i<ws.length; i+=L.size, n++) VUNITS.push({id:`v-${L.k}-${n}`, type:"vocab", lvl:li, n, words:ws.slice(i, i+L.size).map(w=>w.id), v:VUNITS.length}); });

for (const u of VUNITS) for (const id of u.words){ WORD_V[id] = u.v; const w = BYID[id];
  for (const h of w.h.replace(/[()]/g,"").split("/")) for (const c of h) if (isHan(c) && !CHAR_V.has(c)) CHAR_V.set(c, u.v); }
const LV_FIRSTV = LEVELS.map((_,li)=>VUNITS.find(u=>u.lvl===li).v), LV_LASTV = LEVELS.map((_,li)=>VUNITS.filter(u=>u.lvl===li).at(-1).v);
function vposOf(text){ let m = -1; for (const c of text) if (isHan(c)){ const v = CHAR_V.get(c); if (v===undefined) return Infinity; if (v>m) m = v; } return m; }
const ELV_NONE = 99;
function placeItem(x, text){ x.vp = vposOf(text); x.elv = x.vp===Infinity ? ELV_NONE : Math.max(x.lv ?? 0, x.vp<0 ? 0 : VUNITS[x.vp].lvl); return x; }
/* label pembicara 男/女 ditampilkan dalam bahasa Indonesia, jadi tidak perlu sudah diajarkan */
const SPK = {"男":"Pria", "女":"Wanita"};
const TEXT_OF = {
  gram: g => g.c.map(c=>c[0]).join(""), dlg: d => d.b.map(b=>(SPK[b[0]] ? "" : b[0])+b[1]).join(""), story: s => s.h,
  read: r => r.h + r.qs.map(q=>q[0]+q[3][0]+q[4][0]+q[5][0]).join(""),
  qa: q => q[0]+q[3]+q[6]+q[8], dc: d => d.d.map(x=>(SPK[x[0]] ? "" : x[0])+x[1]).join("")+d.q[0]+d.o.map(o=>o[0]).join(""),
  gap: g => g[0].replace("＿", g[3])+g[4]+g[5], order: o => o[0]
};
for (const [arr, k] of [[GRAMMAR,"gram"],[DIALOGS,"dlg"],[STORIES,"story"],[READ,"read"],[QA,"qa"],[DC,"dc"],[GAP,"gap"],[ORDER,"order"]]) for (const x of arr) placeItem(x, TEXT_OF[k](x));
/* materi untuk unit/level: karakter sudah diajarkan sampai maxV, level efektif ≤ L; level L didahulukan */
const pickV = (arr, maxV, L, n) => { const ok = arr.filter(x=>x.vp<=maxV && x.elv<=L);
  return [...shuffle(ok.filter(x=>x.elv===L)), ...shuffle(ok.filter(x=>x.elv<L))].slice(0, n); };

function skillsFor(li){
  const idx = arr => arr.map((x,i)=>x.elv===li?i:-1).filter(i=>i>=0).sort((a,b)=>arr[a].vp-arr[b].vp);
  const vp = (arr, is) => Math.max(...is.map(i=>arr[i].vp));
  const g = idx(GRAMMAR).map(i=>({k:"gram",i, vp:GRAMMAR[i].vp})), d = idx(DIALOGS).map(i=>({k:"dlg",i, vp:DIALOGS[i].vp})), r = idx(READ).map(i=>({k:"read",i, vp:READ[i].vp}));
  const q = chunk(idx(QA), 6).map((items,n)=>({k:"qa", n:n+1, items, i:`${li}-${n+1}`, vp:vp(QA,items)})), c = chunk(idx(DC), 4).map((items,n)=>({k:"dc", n:n+1, items, i:`${li}-${n+1}`, vp:vp(DC,items)}));
  const rot = [d, q, r, c], out = []; let t = 0;
  while (g.length || d.length || q.length || r.length || c.length){
    if (g.length) out.push(g.shift());
    for (let n=0;n<4;n++){ const src = rot[t++%4]; if (src.length){ out.push(src.shift()); break; } }
  }
  return out;
}
const COURSE = (() => {
  const units = [];
  LEVELS.forEach((L, li) => {
    const vs = VUNITS.filter(u=>u.lvl===li), skills = skillsFor(li), V = vs.length, first = vs[0].v;
    /* sebar rata di level ini, tetapi tidak sebelum karakternya diajarkan */
    skills.forEach((k,j) => { k.at = Math.max(k.vp, first + Math.max(0, Math.round((j+1)*V/(skills.length+1)) - 1)); });
    skills.sort((a,b)=>a.at-b.at);
    let s = 0;
    for (const u of vs){
      units.push(u);
      if (u.v===0) units.push({id:"s-nada", type:"skill", s:{k:"nada"}, lvl:0, v:0});
      while (s<skills.length && skills[s].at<=u.v){ const k = skills[s++]; units.push({id:`s-${k.k}-${k.i}`, type:"skill", s:k, lvl:li, v:u.v}); }
    }
  });
  units.forEach((u,i)=>u.idx=i);
  return units;
})();

const firstOpen = () => COURSE.find(u=>!done.has(u.id)) || null;
const unlocked = u => { const f = firstOpen(); return !f || u.idx <= f.idx || done.has(u.id); };

    : s.k==="read" ? `Bacaan: ${READ[s.i].t}` : s.k==="qa" ? `Tanya-jawab ${LEVELS[u.lvl].k} · ${s.n}` : `Memahami dialog ${LEVELS[u.lvl].k} · ${s.n}`;

const pinyinLine = p => `<div class="py">${esc(p)}</div>`;
/* pinyin soal disembunyikan di balik petunjuk agar soal tidak terlalu mudah */
const pyHint = p => `<details class="py-hint"><summary>Lihat pinyin</summary><div class="py" style="white-space:pre-line">${esc(p)}</div></details>`;
/* kata yang sudah diajarkan sampai unit kosakata v (untuk pengecoh) */
const LEARNED = VUNITS.flatMap(u=>u.words.map(id=>BYID[id])), VEND = [];
VUNITS.forEach(u => VEND[u.v] = (VEND[u.v-1] || 0) + u.words.length);
const learnedUpTo = v => LEARNED.slice(0, VEND[v ?? VUNITS.length-1]);
function distractWords(w, n, pool){
  const a = arti(w), out = [], seen = new Set([w.hk, a]);
  for (const x of shuffle(pool.length>=8?pool:WORDS)){ if (out.length>=n) break; const ax = arti(x); if (seen.has(x.hk) || seen.has(ax)) continue; seen.add(x.hk); seen.add(ax); out.push(x); }
  return out;
}
function wordAfter(w){
  const {pk, syl} = forms(w), s = sandhi(syl);
  return `<div class="han" style="font-size:1.6rem">${hanziHTML(w.hk, pk)}</div>${pinyinLine(pk)}${s?`<div class="sandhi">dibaca: ${esc(s)}</div>`:""}<div><b>${esc(arti(w))}</b></div>`;
}
function vocabQ(w, kind){
  const pool = learnedUpTo(WORD_V[w.id]), {pk, syl} = forms(w), after = wordAfter(w);
  if (kind==="tone" && (!syl || syl.length>3 || syl.some(s=>s==="r"))) kind = "h2a";
  if (kind==="listen" && !audioOK) kind = "p2h";
  if (kind==="tone"){
    const right = syl.join(""), set = new Set([right]); let g = 0;
    while (set.size<4 && g++<80) set.add(syl.map(s=>markSyl(parseSyl(s).base, g<50?1+(Math.random()*4|0):1+(Math.random()*5|0))).join(""));
    return {label:"Pilih tanda nada yang benar", prompt:`<div class="hz">${esc(w.hk)}</div><div class="txt">${syl.map(s=>parseSyl(s).base).join("")}</div><div class="small muted">${esc(arti(w))}</div>${speakBtn(w.hk,"Petunjuk suara")}`,
      opts:shuffle([...set]).map(p=>({html:`<span style="font-size:1.25rem">${esc(p)}</span>`, ok:p===right})), after, say:w.hk};
  }
  const all = shuffle([w, ...distractWords(w, 3, pool)]);
  /* pilihan hanya hanzi: pinyin baru terlihat setelah menjawab */
  const hzOpt = x => `<span class="han">${esc(x.hk)}</span>`;
  if (kind==="h2a") return {label:"Pilih arti yang tepat", prompt:`<div class="hz">${esc(w.hk)}</div>${pyHint(pk)}`, opts:all.map(x=>({html:esc(arti(x)), ok:x===w})), after, say:w.hk};
  if (kind==="a2h") return {label:"Pilih hanzi yang tepat", prompt:`<div class="txt">${esc(arti(w))}</div>`, opts:all.map(x=>({html:hzOpt(x), ok:x===w})), after, say:w.hk};
  if (kind==="p2h") return {label:"Pinyin ini ditulis dengan hanzi…", prompt:`<div class="txt">${esc(pk)}</div>`, opts:all.map(x=>({html:`<span class="han">${esc(x.hk)}</span>`, ok:x===w})), after, say:w.hk};
  return {label:"Dengarkan, lalu pilih hanzinya", prompt:`<button class="btn primary" data-say="${esc(w.hk)}">${SPEAK_SVG} Putar lagi</button>`, autoplay:w.hk,
    opts:all.map(x=>({html:hzOpt(x), ok:x===w})), after, say:w.hk};
}
const sentAfter = (h,p,id) => `<div class="han" style="font-size:1.35rem">${hanziHTML(h,p)}</div>${pinyinLine(p)}${id?`<div class="muted">${esc(id)}</div>`:""}`;

function gapQ(it){
  const [s,p,id,...o] = it, full = s.replace("＿", o[0]), syl = splitPinyin(p, hanCount(full));
  /* hanzi tanpa pinyin; petunjuk pinyin tidak membocorkan jawaban (bagian kosong tetap ＿) */
  let k = 0, html = "", hint = [];

const withLv = (s, lv) => Object.assign(s.slice(), {lv});

].map(s=>placeItem(s, s[0]));

}

const VKINDS = () => ["h2a","a2h","p2h","tone", ...(audioOK?["listen"]:[])];
function vocabSet(ids, n){

  if (u.type==="vocab") return vocabSet(u.words, Math.min(12, u.words.length));
  const s = u.s;
  if (s.k==="nada") return sample(VUNITS[0].words.map(id=>BYID[id]).filter(w=>forms(w).syl && forms(w).syl.length<=2), 10).map(w=>vocabQ(w,"tone"));
  /* soal pendukung hanya dari materi yang karakternya sudah diajarkan sampai unit ini */
  const L = u.lvl, pk = (arr, n) => pickV(arr, u.v, L, n);
  const fill = qs => { const need = 8 - qs.length; if (need <= 0) return qs;
    return [...qs, ...sample(learnedUpTo(u.v), need).map(w=>vocabQ(w, pick(["h2a","a2h"])))]; };
  if (s.k==="gram") return fill(shuffle([...GRAMMAR[s.i].c.filter(c=>hanCount(c[0])>3).slice(0,2).map(c=>meanQ(withLv(c, L))), ...pk(GAP,4).map(gapQ), ...pk(ORDER,3).map(orderQ)]));
  if (s.k==="dlg") return fill(shuffle([...sample(DIALOGS[s.i].b,3).map(b=>meanQ(withLv([b[1],b[2],b[3]], L))), ...pk(QA,4).map(qaQ), ...pk(DC,2).map(dcQ), ...pk(ORDER,1).map(orderQ)]));
  if (s.k==="qa") return fill(shuffle([...s.items.map(i=>qaQ(QA[i])), ...pk(DC,2).map(dcQ), ...pk(SENTS,2).map(meanQ)]));
  if (s.k==="dc") return fill(shuffle([...s.items.map(i=>dcQ(DC[i])), ...pk(QA,3).map(qaQ), ...pk(GAP,3).map(gapQ)]));
  const r = READ[s.i];
  return fill([...r.qs.map((_,i)=>readQ(r,i)), ...shuffle([...pk(GAP,3).map(gapQ), ...pk(SENTS,2).map(meanQ), ...pk(QA,2).map(qaQ)])]);
}

/* ================= MESIN TES ================= */
function runTest(box, qs, opt){
  const T = {i:0, score:0, ans:null, picked:[], played:false, combo:0};
  const hit = ok => { if (ok){ T.score++; T.combo++; if (T.combo > stats.bestCombo){ stats.bestCombo = T.combo; store.set("stats", stats); checkBadges(); } } else T.combo = 0; };
  const draw = () => {
    if (T.i >= qs.length) return opt.finish(T.score, qs.length);
    const q = qs[T.i], answered = T.ans!==null;
    let body, right;
    if (q.order){
      right = T.ans===true;
      body = `<div class="order-slots">${T.picked.length?T.picked.map((ti,k)=>`<button class="tok" data-un="${k}" ${answered?"disabled":""}>${tokHTML(q.tokens[ti], q.tokPy[ti])}</button>`).join(""):'<span class="small muted">Ketuk kata di bawah sesuai urutan</span>'}</div>
      <div class="order-bank">${q.tokens.map((t,ti)=>`<button class="tok ${T.picked.includes(ti)?"used":""}" data-tok="${ti}" ${answered?"disabled":""}>${tokHTML(t, q.tokPy[ti])}</button>`).join("")}</div>
      ${answered?"":`<div style="text-align:center"><button class="btn primary" id="check" ${T.picked.length<q.tokens.length?"disabled":""}>Periksa</button></div>`}`;
    } else {
      right = answered && q.opts[T.ans].ok;
      body = `<div class="opts ${q.one?"one":""}">${q.opts.map((o,i)=>`<button class="opt ${answered?(o.ok?"right":(T.ans===i?"wrong":"")):""}" data-opt="${i}" ${answered?"disabled":""}>${o.html}</button>`).join("")}</div>`;
    }
    if (answered) body += `<div class="feedback ${right?"ok":"no"}">${right?"對了！Benar.":"Belum tepat."}</div>`;
    box.innerHTML = `<div class="quiz">
      <div class="q-head"><span>${esc(opt.title||"")}</span><span>${T.combo>=2?`<span style="color:var(--accent)">Combo ×${T.combo}</span> · `:""}Soal ${T.i+1}/${qs.length} · benar ${T.score}</span></div>
      <div class="progress"><i style="width:${T.i/qs.length*100}%"></i></div>
      <div class="panel q-prompt ${q.left?"left":""}"><span class="q-label">${q.label}</span>${q.prompt}</div>
      ${body}
      ${answered?`<div class="after">${q.after}</div><div style="display:flex;gap:8px;justify-content:center;align-items:center">${q.say?speakBtn(q.say,"Dengarkan"):""}<button class="btn primary" id="next">${T.i+1<qs.length?"Soal berikutnya":"Lihat hasil"}</button></div>`:""}
    </div>`;
    if (!answered && q.autoplay && !T.played){ T.played = true; speak(q.autoplay); }
    box.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { T.ans = +b.dataset.opt; hit(q.opts[T.ans].ok); draw(); $("#next")?.focus(); });
    box.querySelectorAll("[data-tok]").forEach(b => b.onclick = () => { T.picked.push(+b.dataset.tok); draw(); });
    box.querySelectorAll("[data-un]").forEach(b => b.onclick = () => { T.picked.splice(+b.dataset.un, 1); draw(); });
    $("#check")?.addEventListener("click", () => { T.ans = q.answers.includes(T.picked.map(i=>q.tokens[i]).join("")); hit(T.ans); draw(); $("#next")?.focus(); });
    $("#next")?.addEventListener("click", () => { T.i++; T.ans = null; T.picked = []; T.played = false; draw(); box.scrollIntoView({block:"start"}); });
  };
  draw();
}

const HW_CDN = "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/";
const bucketCache = {};
function charLoader(ch, onLoad, onError){
  if (window.STROKES[ch]) return onLoad(window.STROKES[ch]);
  const b = ch.codePointAt(0) % 64;
  (bucketCache[b] ||= fetch(`strokes/${b}.json`).then(r=>r.ok?r.json():{}).catch(()=>({})))
    .then(d => d[ch] ? onLoad(d[ch]) : fetch(HW_CDN+encodeURIComponent(ch)+".json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(onLoad))
    .catch(()=>onError && onError());
}
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function makeWriter(el, ch, size, info){
  const plain = () => { el.innerHTML = `<div class="han" style="display:grid;place-items:center;height:100%;font-size:${size*.6}px">${esc(ch)}</div>`; };
  if (!window.HanziWriter){ plain(); if (info) info.textContent = "Pustaka goresan gagal dimuat."; return null; }
  el.innerHTML = "";
  return HanziWriter.create(el, ch, {
    width:size, height:size, padding:size*.06, showOutline:true, strokeAnimationSpeed:1, delayBetweenStrokes:180,
    strokeColor:cssv("--ink"), outlineColor:cssv("--line"), drawingColor:cssv("--accent"), highlightColor:cssv("--accent"), radicalColor:cssv("--accent"),
    charDataLoader:charLoader,
    onLoadCharDataSuccess: d => { if (info) info.textContent = `${d.strokes.length} goresan. Radikal ditandai biru.`; },
    onLoadCharDataError: () => { plain(); if (info) info.textContent = "Data goresan untuk karakter ini belum tersedia."; }
  });
}
function openStroke(text){
  const chars = [...text].filter(isHan).slice(0,6), row = $("#stroke-row");
  $("#stroke-title").textContent = `Goresan & komponen · ${text}`;
  row.innerHTML = chars.map((c,i)=>`<div class="stroke-cell"><div class="tian" id="sw-${i}"></div><div class="chips"><button class="btn sm primary" data-sw="${i}" data-act="anim">Animasi</button><button class="btn sm" data-sw="${i}" data-act="quiz">Latihan</button></div></div>`).join("");
  const dlg = $("#stroke-dlg"); if (!dlg.open) dlg.showModal();
  const ws = chars.map((c,i)=>makeWriter($("#sw-"+i), c, 170));
  row.onclick = e => { const b = e.target.closest("[data-sw]"); if (!b) return; const w = ws[+b.dataset.sw]; if (!w) return;
    if (b.dataset.act==="anim") w.animateCharacter(); else w.quiz({onComplete:()=>{ stats.writes++; addXP(5); toast("Bagus! +5 XP"); }}); };
  ws.forEach((w,i)=> w && setTimeout(()=>w.animateCharacter(), 300+i*1200));
  $("#stroke-decomp").innerHTML = [...new Set(chars)].map(decompHTML).join('<hr style="border:0;border-top:1px dashed var(--line);width:100%">');
}

/* ================= UNIT ================= */
function startUnit(id){ openUnit = {u:UNIT[id], phase:"study"}; route = "unit"; render(); window.scrollTo(0,0); }
function renderUnit(){
  if (!openUnit || openUnit.phase==="skip") return;
  const {u, phase} = openUnit, view = $("#view");
  const top = `<div class="toolbar"><a class="btn sm" href="#jalur">← Jalur belajar</a><span class="small muted">Unit ${u.idx+1} dari ${COURSE.length} · ${LEVELS[u.lvl].nama}</span></div>`;
  if (phase==="test"){
    view.innerHTML = `${top}<div id="testbox"></div>`;
    runTest($("#testbox"), unitQuestions(u), {title:unitTitle(u), finish:(sc,n)=>finishUnit(u,sc,n)});
    return;
  }
  let body = "";
  if (u.type==="vocab") body = `<div class="cards">${u.words.map(id=>wordCard(BYID[id])).join("")}</div>`;
  else {
    const s = u.s;
    if (s.k==="nada") body = `<div class="panel" style="display:grid;gap:10px"><p>Ingat kembali lima nada: <span class="t1">mā</span> datar tinggi, <span class="t2">má</span> naik, <span class="t3">mǎ</span> rendah, <span class="t4">mà</span> turun, <span class="t5">ma</span> ringan. Tes unit ini meminta kamu memilih tanda nada yang benar untuk kata-kata Novice 1.</p><a class="btn" href="#bunyi" style="justify-self:start">Pelajari halaman Nada & Pinyin</a></div>`;
    else if (s.k==="gram"){ const g = GRAMMAR[s.i]; body = `<div class="panel" style="display:grid;gap:10px"><h3>${esc(g.j)} <span class="han" style="color:var(--accent);font-weight:400">${esc(g.pola)}</span></h3><p>${esc(g.d)}</p>${g.c.map(sentRow).join("")}</div>`; }
    else if (s.k==="dlg"){ const d = DIALOGS[s.i]; body = `<div class="panel" style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><p class="muted">${esc(d.s)}</p><button class="btn sm audio-only" id="play-all">Putar semua</button></div>${dialogHTML(d)}</div>`; }
    else body = `<div class="panel"><p>${{qa:"Format 問答理解: kamu mendengar atau membaca satu pertanyaan, lalu memilih jawaban yang paling wajar dari tiga pilihan.",dc:"Format 對話理解: baca dialog pendek, lalu jawab pertanyaan tentang isinya.",read:"Format 閱讀理解: baca teks pendek seperti pengumuman, pesan, atau menu, lalu jawab pertanyaannya."}[s.k]} Pinyin bisa dimatikan di pengaturan bila ingin tantangan lebih.</p></div>`;
  }
  view.innerHTML = `${top}${head(done.has(u.id)?"Selesai · bisa diulang":"Pelajari dulu", esc(unitTitle(u)), u.type==="vocab"?`Baca setiap kata, dengarkan, dan perhatikan nadanya. Tes berisi ${Math.min(12,u.words.length)} soal campuran; lulus 80% membuka unit berikutnya.`:"Pelajari materinya, lalu kerjakan tes. Lulus 80% membuka unit berikutnya.")}
    ${body}<div style="text-align:center"><button class="btn primary" id="start-test">Mulai tes unit</button></div>`;
  $("#start-test").onclick = () => { openUnit.phase = "test"; renderUnit(); window.scrollTo(0,0); };
  $("#play-all")?.addEventListener("click", () => playDialog(DIALOGS[u.s.i]));
}
function finishUnit(u, sc, n){
  const pass = sc/n >= 0.8, wasDone = done.has(u.id);
  addXP(sc*10);
  if (pass){ done.add(u.id); saveDone(); if (u.type==="vocab") learn(u.words); }
  const nx = firstOpen();
  $("#testbox").innerHTML = `<div class="panel result"><div class="big">${pass?"通過！":"再加油！"}</div><h3>${sc} / ${n} benar · ${Math.round(sc/n*100)}%</h3>
    <p class="muted">${pass?(wasDone?"Unit ini sudah selesai sebelumnya.":"Unit selesai. "+(u.type==="vocab"?"Kata-katanya masuk ke kartu hafalan.":"")):"Butuh 80% untuk lulus. Pelajari lagi materinya, lalu coba lagi."}</p>
    <div class="chips" style="justify-content:center">${pass && nx?`<button class="btn primary" data-unit="${nx.id}">Lanjut: ${esc(unitTitle(nx))}</button>`:""}<button class="btn" data-unit="${u.id}">${pass?"Ulangi unit ini":"Pelajari lagi"}</button><a class="btn" href="#jalur">Jalur belajar</a></div></div>`;
}
function startSkip(li){
  openUnit = {phase:"skip"}; route = "unit";
  $("#nav").innerHTML = navHTML();  const L = LEVELS[li], qs = sample(BYLVL[li], 20).map(w=>vocabQ(w, pick(["h2a","a2h","p2h"])));
  $("#view").innerHTML = `<div class="toolbar"><a class="btn sm" href="#jalur">← Jalur belajar</a></div>${head("Uji lompat", `Uji lompat ${esc(L.nama)}`, "20 soal acak dari seluruh kosakata level ini. Lulus 85% menandai semua unit di level ini selesai.")}<div id="testbox"></div>`;
  runTest($("#testbox"), qs, {title:`Uji lompat ${L.nama}`, finish:(sc,n)=>{
    const pass = sc/n >= 0.85;
    if (pass){ COURSE.filter(u=>u.lvl<=li).forEach(u=>done.add(u.id)); saveDone(); learn(BYLVL[li].map(w=>w.id), 2); }
    addXP(sc*5);
    const nx = firstOpen();
    $("#testbox").innerHTML = `<div class="panel result"><div class="big">${pass?"通過！":"再加油！"}</div><h3>${sc} / ${n} benar</h3><p class="muted">${pass?`${L.nama} ditandai selesai.`:"Belum mencapai 85%. Lanjutkan jalur unit demi unit."}</p><div class="chips" style="justify-content:center">${nx?`<button class="btn primary" data-unit="${nx.id}">Lanjut: ${esc(unitTitle(nx))}</button>`:""}<a class="btn" href="#jalur">Jalur belajar</a></div></div>`;
  }});
  window.scrollTo(0,0);
}

/* ================= LATIHAN ================= */
const INTERVALS = [1,2,4,8,16,32];
let fc = {queue:[], cur:null, shown:false};
function buildQueue(){ const now = Date.now(); fc = {queue:shuffle(Object.keys(srs).filter(id=>srs[id].due<=now && BYID[id])), cur:null, shown:false}; }
function renderPractice(){
  const box = $("#practice"); if (!box) return;
  if (route==="latihan") return renderBank(box);
  if (fcb.tab==="jelajah") return renderBrowse(box);
  renderSRS(box);
}
/* Flashcard: jelajah kosakata level terpilih */
const fcb = {tab:"jelajah", deck:"all", order:null, i:0, flip:false, mode:"hz"};
function browseIds(){
  if (fcb.deck==="all") return BYLVL[prefs.level].map(w=>w.id);
  return UNIT[fcb.deck]?.words || BYLVL[prefs.level].map(w=>w.id);
}
function renderBrowse(box){
  if (!fcb.order){ fcb.order = browseIds(); fcb.i = 0; fcb.flip = false; }
  const ids = fcb.order, w = BYID[ids[fcb.i]], {pk} = forms(w);
  const units = COURSE.filter(u=>u.type==="vocab" && u.lvl===prefs.level);
  const modes = [["hz","Hanzi"],["hzpy","Hanzi + pinyin"],["id","Arti"]];
  const front = fcb.mode==="id" ? `<div class="front-tx">${esc(arti(w))}</div>`
    : `<div class="front-hz">${fcb.mode==="hzpy" ? rubyHTML(w.hk, pk) : esc(w.hk)}</div>`;
  const back = `<div class="front-hz">${rubyHTML(w.hk, pk)}</div><div class="py" style="font-size:1.3rem">${esc(pk)}</div><div style="font-size:1.15rem;font-weight:700">${esc(arti(w))}</div><div style="width:100%;text-align:left">${examplesHTML(w, 3)}</div>
    ${NOTES[w.hk]?`<div class="small muted">${esc(NOTES[w.hk])}</div>`:""}<div style="display:flex;gap:8px;justify-content:center">${speakBtn(w.hk)}<button class="btn sm" data-stroke="${esc(w.hk)}">Bedah hanzi</button></div>`;
  const known = !!srs[w.id];
  box.innerHTML = `<div class="fc">
    <div class="toolbar" style="width:100%"><label class="small" style="display:flex;gap:8px;align-items:center">Dek <select class="field" id="fc-deck" style="width:auto;max-width:260px">
      <option value="all" ${fcb.deck==="all"?"selected":""}>Semua kata ${esc(LEVELS[prefs.level].nama)} (${BYLVL[prefs.level].length})</option>
      ${units.map(u=>`<option value="${u.id}" ${fcb.deck===u.id?"selected":""}>Unit ${u.n} · ${esc(u.words.slice(0,3).map(id=>BYID[id].hk).join(" "))}…</option>`).join("")}</select></label>
      <div class="chips">${modes.map(([k,n])=>`<button class="chip" data-fmode="${k}" aria-pressed="${fcb.mode===k}">Depan: ${n}</button>`).join("")}</div></div>
    <div class="counts"><span>Kartu <b>${fcb.i+1}</b> / ${ids.length}</span><span>Sudah di ulangan <b>${ids.filter(id=>srs[id]).length}</b></span></div>
    <div class="progress" style="width:min(480px,100%)"><i style="width:${(fcb.i+1)/ids.length*100}%"></i></div>
    <div class="panel flip pop" id="fc-card" role="button" tabindex="0" aria-label="Balik kartu">${fcb.flip ? back : front + '<div class="hint">Ketuk untuk membalik</div>'}</div>
    <div class="fc-actions"><button class="btn" id="fc-prev" ${fcb.i===0?"disabled":""}>← Sebelumnya</button><button class="btn" id="fc-flip">Balik</button><button class="btn primary" id="fc-next">Berikutnya →</button></div>
    <div class="fc-actions"><button class="btn sm" id="fc-shuf">Acak urutan</button><button class="btn sm" id="fc-known" ${known?"disabled":""}>${known?"Sudah masuk ulangan":"Masukkan ke ulangan berjadwal"}</button></div>
    <p class="small muted">Pintasan: Spasi = balik, ← → = pindah kartu</p></div>`;
  const flip = () => { fcb.flip = !fcb.flip; if (fcb.flip) speak(w.hk); renderBrowse(box); };
  $("#fc-card").onclick = e => { if (!e.target.closest("button")) flip(); };
  $("#fc-flip").onclick = flip;
  $("#fc-prev").onclick = () => { fcb.i = Math.max(0, fcb.i-1); fcb.flip = false; renderBrowse(box); };
  $("#fc-next").onclick = () => { fcb.i = (fcb.i+1) % ids.length; fcb.flip = false; addXP(1); renderBrowse(box); };

function startRoleplay(di, role){
  const d = DIALOGS[di], box = $("#dlg-box"); if (!box) return;
  const pool = DIALOGS.filter(x=>x!==d && x.elv<=d.elv && x.elv>=d.elv-1).flatMap(x=>x.b);
  const hist = []; let i = 0, score = 0, mine = 0;
  const lineHTML = (b, me, mark) => `<div class="rp-line ${me?"me":""}"><span class="who">${esc(b[0])}${me?" · kamu":""}</span><div><div class="s-han">${hanziHTML(b[1],b[2])} ${mark||""}</div><div class="py">${esc(b[2])}</div><div class="muted small">${esc(b[3])}</div></div></div>`;
  const draw = prompt => { box.innerHTML = `<div>${hist.join("")}</div>${prompt}`; box.lastElementChild?.scrollIntoView({block:"nearest", behavior:"smooth"}); };
  const step = () => {
    while (i < d.b.length && d.b[i][0] !== role){ const b = d.b[i++]; hist.push(lineHTML(b, false)); if (i===1 || d.b[i]?.[0]===role) speak(b[1]); }
    if (i >= d.b.length){
      addXP(score*5);
      draw(`<div class="panel result pop"><div class="big">${score===mine?"太棒了！":"加油！"}</div><h3>${score} / ${mine} balasan tepat</h3>
        <div class="chips" style="justify-content:center"><button class="btn primary" data-rp="${di}|${esc(role)}">Main lagi</button>${speakersOf(d).filter(r=>r!==role).map(r=>`<button class="btn" data-rp="${di}|${esc(r)}">Jadi ${esc(r)}</button>`).join("")}<button class="btn" data-dlg="${di}">Kembali ke dialog</button></div></div>`);
      return;

function segment(text){
  const out = [], cs = [...text]; let i = 0;
  while (i < cs.length){
    if (!isHan(cs[i])){ out.push({t:cs[i]}); i++; continue; }
    let hit = cs[i];
    for (let n=Math.min(6, cs.length-i); n>=2; n--){ const s = cs.slice(i,i+n).join(""); if (DICT.has(s)){ hit = s; break; } }
    out.push({t:hit, w:DICT.get(hit)||null}); i += [...hit].length;
  }
  return out;
}

function gameWrite(g, box){
  const pool = shuffle(gameWords().filter(w=>{ const n = hanCount(w.hk); return n>=1 && n<=2 && n===[...w.hk].length; })).slice(0, 6);
  let r = 0, score = 0;
  const round = () => {
    if (r >= pool.length) return endGame(g, score, `${score} dari ${pool.length} kata ditulis dengan baik`);
    const w = pool[r], chars = [...w.hk], {pk} = forms(w); let c = 0, miss = 0;
    const drawChar = () => {
      box.innerHTML = `<div class="quiz">${hudHTML(`Kata ${r+1}/${pool.length}`, `Benar ${score}`)}
        <div class="panel q-prompt"><span class="q-label">筆 · Tulis dari ingatan</span><div class="txt">${esc(arti(w))}</div><div class="py" style="font-size:1.2rem">${esc(pk)}</div>
        <div class="small muted">Karakter ${c+1} dari ${chars.length}${chars.length>1?`: <span class="han">${chars.slice(0,c).join("")}${"＿".repeat(chars.length-c)}</span>`:""}</div>
        <div class="tian" id="gw" style="width:240px;height:240px;max-width:100%"></div><div class="chips"><button class="btn sm" id="gw-hint">Lihat kerangka</button><button class="btn sm" id="gw-skip">Lewati</button></div></div></div>`;
      if (!window.HanziWriter){ $("#gw").innerHTML = '<p class="small muted">Pustaka goresan gagal dimuat.</p>'; return; }
      const wr = HanziWriter.create($("#gw"), chars[c], {width:240, height:240, padding:14, showOutline:false, showCharacter:false,
        strokeColor:cssv("--ink"), outlineColor:cssv("--line"), drawingColor:cssv("--accent"), highlightColor:cssv("--accent"), charDataLoader:charLoader});
      const next = () => { c++; if (c < chars.length) return drawChar();
        const ok = miss <= 3*chars.length; if (ok) score++; stats.writes++; speak(w.hk);
        box.querySelector(".q-prompt").insertAdjacentHTML("beforeend", `<div class="feedback ${ok?"ok":"no"}">${ok?"寫對了！":"Masih banyak salah goresan."} <span class="han" style="font-size:1.6rem">${esc(w.hk)}</span></div><button class="btn primary" id="gw-next">Lanjut</button>`);
        $("#gw-next").onclick = () => { r++; round(); }; };
      wr.quiz({showHintAfterMisses:3, onMistake:()=>miss++, onComplete:()=>setTimeout(next, 500)});
      $("#gw-hint").onclick = () => { miss += 3; wr.showOutline(); };
      $("#gw-skip").onclick = () => { miss += 99; c = chars.length-1; next(); };
    };
    drawChar();
  };
  round();
}
const toneless = s => s.toLowerCase().replace(/ü/g,"v").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zv]/g,"");
const marked = s => s.toLowerCase().normalize("NFC").replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜ]/g,"");
function gameTyping(g, box){
  const pool = sample(gameWords().filter(w=>forms(w).syl), 10); let r = 0, score = 0;
  const round = () => {
    if (r >= pool.length) return endGame(g, score, `${score} dari ${pool.length} pinyin diketik benar`);
    const w = pool[r], {pk} = forms(w);
    box.innerHTML = `<div class="quiz typing">${hudHTML(`Soal ${r+1}/${pool.length}`, `Benar ${score}`)}
      <div class="panel q-prompt"><span class="q-label">鍵 · Ketik pinyin</span><div class="hz">${esc(w.hk)}</div><div class="small muted">${esc(arti(w))}</div>${speakBtn(w.hk,"Petunjuk suara")}</div>
      <input class="field" id="ty-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mis. xuesheng atau xue2 sheng1">
      <div class="feedback" id="ty-fb"></div><div style="text-align:center"><button class="btn primary" id="ty-go">Periksa</button></div></div>`;
    const inp = $("#ty-in"); inp.focus();
    let checked = false;
    const check = () => {
      if (checked){ r++; return round(); }
      const v = inp.value.trim(); if (!v) return;
      const strict = /\d/.test(v), ok = strict ? marked(numToMark(v)) === marked(pk) : toneless(v) === toneless(pk);
      if (ok) score++; checked = true; speak(w.hk);
      $("#ty-fb").className = `feedback ${ok?"ok":"no"}`;
      $("#ty-fb").innerHTML = `${ok?"對了！":"Belum tepat."} Jawaban: <span style="font-size:1.2rem">${esc(pk)}</span>${strict?" (mode ketat: nada diperiksa)":""}`;
      $("#ty-go").textContent = r+1<pool.length ? "Soal berikutnya" : "Lihat hasil";
    };
    $("#ty-go").onclick = check;
    inp.onkeydown = e => { if (e.key==="Enter") check(); };
  };
  round();
}
