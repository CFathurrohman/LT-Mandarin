}
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open("hyxt2", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function connectAutosave(){
  try {
    const handle = await window.showSaveFilePicker({suggestedName:"huayu-kemajuan.json", types:[{description:"File simpanan 華語學堂", accept:{"application/json":[".json"]}}]});
    autosave = {...autosave, handle, name:handle.name, state:"on"};
    try { await idbSet("saveHandle", handle); } catch {}
    await writeAutosave(); toast(`Autosave tersambung ke ${handle.name}`);
  } catch (e) { if (e?.name !== "AbortError") toast("Autosave tidak bisa disambungkan di browser ini."); }
  if ($("#save-dlg").open) openSave();
}
async function resumeAutosave(){
  try { if (await autosave.handle.requestPermission({mode:"readwrite"}) === "granted"){ autosave.state = "on"; await writeAutosave(); toast("Autosave aktif lagi"); } } catch {}
  if ($("#save-dlg").open) openSave();
}
async function disconnectAutosave(){ autosave = {handle:null, name:"", timer:null, last:null, state:"off"}; try { await idbSet("saveHandle", null); } catch {} updateSaveDots(); openSave(); }
async function initAutosave(){
  if (!canAutosave()) return;
  try { const h = await idbGet("saveHandle"); if (!h) return;
    autosave = {...autosave, handle:h, name:h.name, state: await h.queryPermission({mode:"readwrite"}) === "granted" ? "on" : "paused"}; updateSaveDots();
    if (route === "beranda") render();
  } catch {}
}
/* ajakan di Beranda: pilih file autosave sekali, atau lanjutkan setelah browser meminta izin lagi */
function autosaveBanner(){
  if (!canAutosave() || autosave.state === "on") return "";
  if (autosave.state === "paused" || autosave.state === "error")
    return `<div class="notice save-banner"><span><span class="save-dot warn"></span> Autosave ke <b>${esc(autosave.name)}</b> berhenti sejak halaman dibuka ulang. Browser butuh izinmu untuk menulis ke file itu lagi.</span><button class="btn sm primary" data-as="resume">Lanjutkan autosave</button></div>`;
  return `<div class="notice save-banner"><span><b>Simpan kemajuan otomatis ke file.</b> Pilih satu file sekali saja; setiap perubahan langsung ditulis ke sana, jadi kemajuan aman walau data browser terhapus.</span><button class="btn sm primary" data-as="on">Pilih file autosave</button></div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-as]"); if (!b) return;
  if (b.dataset.as === "on") await connectAutosave(); else await resumeAutosave();
  if (route === "beranda") render();
});
function updateSaveDots(){ document.querySelectorAll(".save-dot").forEach(d => { d.className = "save-dot " + (autosave.state==="on" ? "on" : autosave.state==="off" ? "" : "warn"); }); }
function downloadSave(){
  const blob = new Blob([JSON.stringify(snapshot(), null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `huayu-kemajuan-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("File simpanan dibuat. Kalau tidak terunduh, pakai Salin kode simpanan.");
}
const encodeSave = o => "HYXT1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function decodeSave(text){
  text = String(text).trim();
  const o = text.startsWith("HYXT1:") ? JSON.parse(decodeURIComponent(escape(atob(text.slice(6))))) : JSON.parse(text);
  if (o?.app !== SAVE_APP || typeof o.data !== "object") throw new Error("bukan file simpanan 華語學堂");
  return o;
}
function copySaveCode(){
  const code = encodeSave(snapshot()), box = $("#save-code");
  const fallback = () => { box.hidden = false; box.value = code; box.select(); toast("Kode ada di kotak bawah. Salin dengan Ctrl+C."); };
  try { navigator.clipboard.writeText(code).then(() => toast("Kode simpanan disalin. Tempel di perangkat lain."), fallback); } catch { fallback(); }
}
function previewImport(o){
  const d = o.data, n = (d.done||[]).length, xp = d.stats?.xp || 0, cards = Object.keys(d.srs||{}).length, lv = LEVELS[d.prefs?.level || 0]?.nama || "—";
  $("#save-preview").innerHTML = `<div class="panel" style="display:grid;gap:8px;border-color:var(--accent)"><b>Isi file simpanan</b>
    <div class="small">Disimpan ${esc(new Date(o.savedAt).toLocaleString("id-ID"))} · ${n} unit selesai · ${xp} XP · ${cards} kartu hafalan · level ${esc(lv)}</div>
    <p class="small muted">Kemajuan di browser ini akan diganti seluruhnya oleh isi file ini.</p>
    <div class="chips"><button class="btn" id="imp-cancel">Batal</button><button class="btn primary" id="imp-go">Ganti kemajuan dengan file ini</button></div></div>`;
  $("#imp-cancel").onclick = () => { $("#save-preview").innerHTML = ""; };
  $("#imp-go").onclick = () => applyImport(o);
}
function applyImport(o){
  for (const k of SAVE_KEYS){
    if (k in o.data) store.set(k, o.data[k]);
    else { delete store.mem[k]; try { localStorage.removeItem("hyxt2:"+k); } catch {} }
  }
  if (lsWorks()) return location.reload();
  /* localStorage diblokir: muat ke memori saja */
  Object.assign(prefs, o.data.prefs || {}); srs = o.data.srs || {}; stats = Object.assign({xp:0, streak:0}, o.data.stats || {});
  done = new Set(o.data.done || []); games = o.data.games || {}; badges = new Set(o.data.badges || []);
  $("#save-dlg").close(); applyPrefs(); renderLevelPickers(); render(); toast("Kemajuan dimuat");
}
function openSave(){
  const dlg = $("#save-dlg"), ls = lsWorks(), snap = snapshot(), d = snap.data;
  const auto = !canAutosave() ? `<p class="small muted">Autosave ke file tersedia di Chrome atau Edge saat membuka <code>index.html</code> versi lokal. Di sini, simpan secara manual dengan tombol di atas.</p>`
    : autosave.state==="on" ? `<p class="small"><span class="save-dot on"></span> Tersambung ke <b>${esc(autosave.name)}</b>. Setiap perubahan otomatis ditulis ke file itu${autosave.last?`; terakhir ${autosave.last.toLocaleTimeString("id-ID")}`:""}.</p><div class="chips"><button class="btn sm" id="as-off">Putuskan autosave</button></div>`
    : autosave.state==="paused" || autosave.state==="error" ? `<p class="small"><span class="save-dot warn"></span> Autosave ke <b>${esc(autosave.name)}</b> perlu izin lagi.</p><div class="chips"><button class="btn sm primary" id="as-resume">Lanjutkan autosave</button><button class="btn sm" id="as-off">Putuskan</button></div>`
    : `<p class="small muted">Pilih satu file di komputermu; setiap perubahan kemajuan akan otomatis ditulis ke file itu.</p><div class="chips"><button class="btn sm primary" id="as-on">Pilih file autosave…</button></div>`;
  $("#save-body").innerHTML = `
    <div class="save-sec"><b>Penyimpanan otomatis di browser</b>
      <p class="small ${ls?"muted":""}">${ls ? "Kemajuan otomatis tersimpan di browser ini (localStorage). Data ini tidak ikut pindah ke perangkat atau browser lain." : "localStorage diblokir di sini, jadi kemajuan hanya bertahan sampai halaman ditutup. Simpan ke file agar tidak hilang."}</p>
      <p class="small">Sekarang: ${(d.done||[]).length} unit selesai · ${d.stats?.xp||0} XP · ${Object.keys(d.srs||{}).length} kartu hafalan</p></div>
    <div class="save-sec"><b>Simpan ke file</b>
      <div class="chips"><button class="btn primary" id="sv-dl">Unduh file simpanan (.json)</button><button class="btn" id="sv-copy">Salin kode simpanan</button></div>
      <p class="small muted">Di link artifact, unduhan bisa diblokir oleh browser; pakai <b>Salin kode simpanan</b> lalu simpan kodenya di catatan.</p>
      <textarea class="field" id="save-code" rows="3" readonly hidden></textarea></div>
    <div class="save-sec"><b>Autosave ke file</b>${auto}</div>
    <div class="save-sec"><b>Muat kemajuan</b>
      <div class="chips"><label class="btn" for="sv-file">Pilih file simpanan…</label><input type="file" id="sv-file" accept=".json,application/json,text/plain" hidden></div>
      <textarea class="field" id="sv-paste" rows="2" placeholder="…atau tempel kode simpanan (HYXT1:…) di sini"></textarea>
      <div><button class="btn sm" id="sv-load">Muat dari kode</button></div>
      <div id="save-preview"></div></div>`;
  $("#sv-dl").onclick = downloadSave;
  $("#sv-copy").onclick = copySaveCode;
  $("#as-on")?.addEventListener("click", connectAutosave);
  $("#as-resume")?.addEventListener("click", resumeAutosave);
  $("#as-off")?.addEventListener("click", disconnectAutosave);
  const tryLoad = text => { try { previewImport(decodeSave(text)); } catch (e) { $("#save-preview").innerHTML = `<p class="feedback no small">File atau kode tidak bisa dibaca: ${esc(e.message)}</p>`; } };
  $("#sv-file").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => tryLoad(r.result); r.readAsText(f); };
  $("#sv-load").onclick = () => tryLoad($("#sv-paste").value);
  if (!dlg.open) dlg.showModal();
}
document.addEventListener("click", e => { if (e.target.closest("[data-open-save]")){ if (isMobile()) setDrawer(false); $("#settings-dlg").close(); openSave(); } });

/* ================= HOOK SETELAH RENDER ================= */
const AFTER = {
  bunyi(){ const inp = $("#conv-in"), out = $("#conv-out"); const run = () => { const m = numToMark(inp.value).split(/\s+/).filter(Boolean);
    out.innerHTML = m.length ? m.map(s=>`<span class="t${parseSyl(s).tone}">${esc(s)}</span>`).join("") : `<span class="muted small">Hasil muncul di sini.</span>`; }; inp.oninput = run; run(); },
  kosakata(){
    const q = $("#voc-q");
    q.oninput = () => { kosakata.q = q.value; kosakata.limit = 60; const pos = q.selectionStart; render(); const n = $("#voc-q"); n.focus(); n.setSelectionRange(pos,pos); };
    $("#more")?.addEventListener("click", () => { kosakata.limit += 60; const y = window.scrollY; render(); window.scrollTo(0,y); });
  },
  hanzi(){
    const info = $("#hz-info");
    const load = ch => { if (!ch || !isHan(ch)) { info.textContent = "Masukkan karakter Han."; return; } hanzi.ch = ch; $("#hz-say").innerHTML = speakBtn(ch);
      document.querySelectorAll("[data-hzc]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.hzc===ch));
      $("#hz-decomp").innerHTML = decompHTML(ch);
      hanzi.writer = makeWriter($("#writer"), ch, 240, info); hanzi.writer && hanzi.writer.animateCharacter(); };
    const loadWord = () => { const cs = [...new Set([...$("#hz-in").value].filter(isHan))]; if (!cs.length){ info.textContent = "Masukkan karakter Han."; return; }
      hanzi.word = cs.join(""); $("#hz-chars").innerHTML = cs.length>1 ? cs.map(c=>`<button class="chip han" data-hzc="${c}" style="font-size:1.2rem">${c}</button>`).join("") : "";
      document.querySelectorAll("[data-hzc]").forEach(b => b.onclick = () => load(b.dataset.hzc));
      load(cs.includes(hanzi.ch) ? hanzi.ch : cs[0]); };
    $("#hz-load").onclick = () => { hanzi.ch = ""; loadWord(); };
    $("#hz-in").onkeydown = e => { if (e.key==="Enter") $("#hz-load").click(); };
    $("#hz-anim").onclick = () => hanzi.writer && hanzi.writer.animateCharacter();
    $("#hz-blind").onchange = e => { hanzi.blind = e.target.checked; };
    $("#hz-quiz").onclick = () => {
      if (hanzi.blind && window.HanziWriter){ $("#writer").innerHTML = ""; hanzi.writer = HanziWriter.create($("#writer"), hanzi.ch, {width:240, height:240, padding:14, showOutline:false, showCharacter:false,
        strokeColor:cssv("--ink"), outlineColor:cssv("--line"), drawingColor:cssv("--accent"), highlightColor:cssv("--accent"), charDataLoader:charLoader}); info.textContent = "Tulis dari ingatan. Petunjuk muncul setelah 3 kali salah."; }
      hanzi.writer && hanzi.writer.quiz({showHintAfterMisses:3, onComplete:s=>{ stats.writes++; addXP(hanzi.blind?8:5); info.textContent = `Selesai dengan ${s.totalMistakes} kesalahan. +${hanzi.blind?8:5} XP`; }});
    };
    loadWord();
  },
  percakapan(){ $("#play-all").onclick = () => playDialog(DIALOGS[percakapan.i]); },
  baca(){
    bindReader();
    $("#rd-back")?.addEventListener("click", () => { baca.item = null; render(); });
    $("#own-go")?.addEventListener("click", () => { baca.own = $("#own-text").value.trim(); render(); });
    document.querySelectorAll("[data-rq]").forEach(b => b.onclick = () => {
      const box = b.parentElement; box.querySelectorAll("[data-rq]").forEach(x => { x.disabled = true; if (x.dataset.rq==="1") x.classList.add("right"); });
      if (b.dataset.rq!=="1") b.classList.add("wrong"); else addXP(3);
    });
  },
  latihan(){ renderPractice(); },
  kartu(){ renderPractice(); }
};

/* ================= EVENT GLOBAL ================= */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href")===location.hash){ e.preventDefault(); go(location.hash.slice(1)); return; }
  const t = e.target.closest("[data-say],[data-stroke],[data-vlvl],[data-dlg],[data-tab],[data-dir],[data-bank],[data-unit],[data-skip],[data-theme-set],[data-hz],[data-game],[data-exam],[data-rp],[data-btab],[data-story]");
  if (!t) return;
  const d = t.dataset;
  if (d.say) { speak(d.say); touchDay(); }
  else if (d.hz){ hanzi.ch = d.hz; hanzi.word = d.hz; if ($("#stroke-dlg").open) $("#stroke-dlg").close();
    if (route==="hanzi"){ render(); $("#writer").scrollIntoView({behavior:"smooth", block:"center"}); } else location.hash = "hanzi"; }
  else if (d.game) startGame(d.game);
  else if (d.exam) startExam(d.exam);
  else if (d.rp){ const [di, role] = d.rp.split("|"); percakapan.i = +di; if (route!=="percakapan"){ location.hash = "percakapan"; } else render(); startRoleplay(+di, role); }
  else if (d.btab){ baca.tab = d.btab; baca.item = null; render(); }
  else if (d.story){ baca.item = readingItems(prefs.level)[+d.story]; render(); window.scrollTo(0,0); }
  else if (d.stroke) openStroke(d.stroke);
  else if (d.vlvl){ kosakata.q = ""; setLevel(+d.vlvl); }
  else if (d.dlg){ if (audioOK) speechSynthesis.cancel(); percakapan.i = +d.dlg; render(); }
  else if (d.tab){ fcb.tab = d.tab; renderPractice(); document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===fcb.tab)); }
  else if (d.dir){ latihan.dir = d.dir; store.set("latihan", latihan); renderPractice(); }
  else if (d.bank){ latihan.bank = d.bank; store.set("latihan", latihan); renderPractice(); }
  else if (d.unit){ if (unlocked(UNIT[d.unit])) startUnit(d.unit); }
  else if (d.skip) startSkip(+d.skip);
  else if (d.themeSet){ prefs.theme = d.themeSet; applyPrefs(); document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.themeSet===prefs.theme)); if (route==="hanzi") render(); }
});
function bindPrefs(root){
  root.addEventListener("input", e => {
    const k = e.target.dataset.pref; if (!k) return;
    if (k==="level") return setLevel(+e.target.value);
    prefs[k] = e.target.type==="checkbox" ? e.target.checked : +e.target.value;
    document.querySelectorAll(`[data-pref="${k}"]`).forEach(x => { if (x!==e.target){ if (x.type==="checkbox") x.checked = prefs[k]; else x.value = prefs[k]; } });
    document.querySelectorAll('[id^="rate-val"]').forEach(x => x.textContent = prefs.rate.toFixed(2)+"×");
    applyPrefs();
  });
}
$("#prefs-side").innerHTML = `<button class="set-btn" id="open-settings">${GEAR_SVG}<span>Pengaturan</span><span class="save-dot" id="save-dot-s"></span></button>`;
$("#open-settings").onclick = openSettings;
bindPrefs($("#settings-body"));
$("#settings-close").onclick = () => $("#settings-dlg").close();
/* sidebar: tutup/buka di desktop, laci geser di ponsel */
const appEl = $(".app"), isMobile = () => matchMedia("(max-width:860px)").matches;
const setDrawer = open => { appEl.classList.toggle("drawer", open); $("#menu-btn").setAttribute("aria-expanded", open); if (open) $("#nav a[aria-current]")?.focus({preventScroll:true}); };
const setCollapsed = v => { prefs.side = v ? "closed" : "open"; appEl.classList.toggle("collapsed", v); store.set("prefs", prefs); };
appEl.classList.toggle("collapsed", prefs.side==="closed");
$("#side-close").onclick = () => isMobile() ? setDrawer(false) : setCollapsed(true);
$("#side-open").onclick = () => setCollapsed(false);
$("#menu-btn").onclick = () => setDrawer(true);
$("#scrim").onclick = () => setDrawer(false);
$("#nav").addEventListener("click", e => { if (e.target.closest("a") && isMobile()) setDrawer(false); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && appEl.classList.contains("drawer")) setDrawer(false); });
syncUnlocked(); renderLevelPickers();
initAutosave();
/* buka/tutup daftar level; klik di luar menutupnya */
document.addEventListener("click", e => {
  const opt = e.target.closest("[data-lvpick]"), btn = e.target.closest(".lvl-btn");
  if (opt){ document.querySelectorAll(".lvl-menu").forEach(m => m.hidden = true); setLevel(+opt.dataset.lvpick); return; }
  if (btn){ const menu = btn.nextElementSibling, open = menu.hidden;
    document.querySelectorAll(".lvl-menu").forEach(m => { m.hidden = true; m.previousElementSibling.setAttribute("aria-expanded","false"); });
    menu.hidden = !open; btn.setAttribute("aria-expanded", open); return; }
  if (!e.target.closest(".lvl-menu")) document.querySelectorAll(".lvl-menu").forEach(m => { if (!m.hidden){ m.hidden = true; m.previousElementSibling.setAttribute("aria-expanded","false"); } });
});
document.addEventListener("keydown", e => { if (e.key==="Escape") document.querySelectorAll(".lvl-menu").forEach(m => m.hidden = true); });
document.body.classList.add("no-audio");
applyPrefs();
if ("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = detectAudio; detectAudio(); setTimeout(detectAudio, 800); setTimeout(detectAudio, 2500); }
go(location.hash.slice(1) || "beranda");
